name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Cek sintaks JS
        run: for f in $(git ls-files 'js/**/*.js' 'js/*.js'); do node --input-type=module --check < "$f" || exit 1; done
