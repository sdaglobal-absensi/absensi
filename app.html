<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — KERJORA</title>
<link rel="icon" type="image/png" href="assets/icon-96.png">
<meta name="theme-color" content="#1F4D3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KERJORA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
// Daftarkan service worker sejak halaman dimuat (syarat PWA bisa di-install).
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
<link rel="stylesheet" href="css/style.css?v=20261002a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="mobile-topbar">
    <button id="btn-hamburger" class="btn-hamburger" aria-label="Buka menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <span class="brand"><img src="assets/kerjora-icon.png" alt="" class="brand-logo"><span id="mobile-title">KERJORA</span></span>
    <button id="btn-notif-mobile" class="btn-notif" aria-label="Notifikasi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9z"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      <span id="notif-badge-mobile" class="notif-badge hidden"></span>
    </button>
  </div>
  <div id="notif-panel" class="notif-panel hidden"></div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><img src="assets/kerjora-icon.png" alt="KERJORA" class="brand-logo">KERJORA</div>
      <div class="sidebar-user">
        <span class="sidebar-avatar" id="sidebar-avatar">—</span>
        <span class="sidebar-user-text">
          <span id="sidebar-user-name">—</span>
          <span id="sidebar-user-role">—</span>
        </span>
      </div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button id="btn-logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Keluar
        </button>
      </div>
    </aside>
    <main class="main">
      <div class="page-topbar">
        <button id="btn-notif-desktop" class="btn-notif btn-notif-desktop" aria-label="Notifikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9z"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span id="notif-badge-desktop" class="notif-badge hidden"></span>
        </button>
      </div>
      <div id="plan-banner" class="hidden"></div>
      <div id="content"><p class="muted">Memuat…</p></div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navigasi utama"></nav>

  <script type="module">
    import { requireAuth, logout } from "./js/auth.js";
    import { renderSidebar, toast, ICONS, isMenuBlockedByPlan, planInfoSync, fmtDate } from "./js/core.js";
    import { initNotifications } from "./js/notifications.js";

    const MODULE_MAP = {
      "dashboard": () => import("./js/modules/dashboard.js"),
      "absensi": () => import("./js/modules/employee-absensi.js"),
      "izin": () => import("./js/modules/employee-izin.js"),
      "lembur": () => import("./js/modules/employee-lembur.js"),
      "koreksi": () => import("./js/modules/employee-koreksi-absen.js"),
      "riwayat": () => import("./js/modules/employee-riwayat.js"),
      "slip-gaji-saya": () => import("./js/modules/employee-slip-gaji.js"),
      "profil": () => import("./js/modules/employee-profil.js"),
      "pengumuman": () => import("./js/modules/employee-pengumuman.js"),
      "dinas-luar": () => import("./js/modules/employee-dinas-luar.js"),
      "dinas-luar-approval": () => import("./js/modules/admin-dinas-luar.js"),
      "kasbon": () => import("./js/modules/employee-kasbon.js"),
      "kasbon-approval": () => import("./js/modules/admin-kasbon.js"),
      "reimburse": () => import("./js/modules/employee-reimburse.js"),
      "reimburse-approval": () => import("./js/modules/admin-reimburse.js"),
      "dokumen": () => import("./js/modules/employee-dokumen.js"),
      "dokumen-kelola": () => import("./js/modules/admin-dokumen.js"),
      "onboarding-kelola": () => import("./js/modules/admin-onboarding.js"),
      "kpi-saya": () => import("./js/modules/employee-kpi.js"),
      "kpi-kelola": () => import("./js/modules/admin-kpi.js"),
      "kpi-nilai": () => import("./js/modules/admin-kpi-nilai.js"),
      "tukar-shift": () => import("./js/modules/employee-tukar-shift.js"),
      "tukar-shift-approval": () => import("./js/modules/admin-tukar-shift.js"),
      "pengumuman-kelola": () => import("./js/modules/admin-pengumuman.js"),
      "karyawan": () => import("./js/modules/admin-karyawan.js"),
      "struktur-organisasi": () => import("./js/modules/admin-struktur-organisasi.js"),
      "analitik-hr": () => import("./js/modules/admin-analitik.js"),
      "absensi-monitor": () => import("./js/modules/admin-absensi.js"),
      "izin-approval": () => import("./js/modules/admin-izin.js"),
      "lembur-approval": () => import("./js/modules/admin-lembur.js"),
      "koreksi-approval": () => import("./js/modules/admin-koreksi-absen.js"),
      "profil-approval": () => import("./js/modules/admin-profil-approval.js"),
      "kenaikan-upah": () => import("./js/modules/admin-kenaikan-upah.js"),
      "slip-gaji": () => import("./js/modules/admin-slip-gaji.js"),
      "invoice-outsourcing": () => import("./js/modules/admin-invoice-outsourcing.js"),
      "laporan": () => import("./js/modules/admin-laporan.js"),
      "master-level": () => import("./js/modules/admin-master-level.js"),
      "master-tunjangan": () => import("./js/modules/admin-master-tunjangan.js"),
      "master-denda": () => import("./js/modules/admin-master-denda.js"),
      "master-departemen": () => import("./js/modules/admin-master-departemen.js"),
      "master-pt": () => import("./js/modules/admin-master-pt.js"),
      "master-jadwal": () => import("./js/modules/admin-master-jadwal.js"),
      "master-libur": () => import("./js/modules/admin-master-libur.js"),
      "master-lokasi": () => import("./js/modules/admin-master-lokasi.js"),
      "kuota-cuti": () => import("./js/modules/admin-kuota-cuti.js"),
      "audit-log": () => import("./js/modules/admin-audit-log.js"),
      "ekspor-backup": () => import("./js/modules/admin-ekspor-backup.js"),
      "paket": () => import("./js/modules/super-paket.js"),
      "platform": () => import("./js/modules/platform-admin.js"),
      "pengaturan-sistem": () => import("./js/modules/super-pengaturan.js"),
    };

    let currentUser = null;
    let allowedTabIds = null; // Set berisi tabId yang boleh dibuka user ini. Sejak Tahap 4 SELALU berisi (juga untuk super_admin), karena menu di luar paket usaha tidak boleh dibuka siapa pun.

    function isTabAllowed(tabId) {
      if (!MODULE_MAP[tabId]) return false;
      if (!allowedTabIds) return true; // super_admin — All Akses, tidak difilter
      return allowedTabIds.has(tabId);
    }

    let menuLabels = {};
    const TAB_ORDER = [
      { id: "dashboard", label: "Beranda", icon: "home" },
      { id: "izin", label: "Izin", icon: "file" },
      { id: "absensi", label: "Absen", icon: "clock", primary: true },
      { id: "riwayat", label: "Riwayat", icon: "history" },
    ];
    let tabbarIds = [];

    function buildTabbar(menu) {
      const ids = new Set(menu.map(m => m.id));
      const tabs = TAB_ORDER.filter(t => ids.has(t.id));
      tabbarIds = tabs.map(t => t.id);
      const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>`;
      const html = tabs.map(t => `
        <button class="tab-item ${t.primary ? "tab-primary" : ""}" data-tab="${t.id}">
          <span class="tab-icon">${svg(ICONS[t.icon])}</span><span class="tab-label">${t.label}</span>
        </button>`).join("") + `
        <button class="tab-item" data-tab="__menu">
          <span class="tab-icon">${svg(ICONS.grid)}</span><span class="tab-label">Menu</span>
        </button>`;
      document.getElementById("tabbar").innerHTML = html;
    }

    function updateTabbarActive(tabId) {
      const inBar = tabbarIds.includes(tabId);
      document.querySelectorAll("#tabbar .tab-item").forEach(b => {
        const t = b.dataset.tab;
        b.classList.toggle("active", t === tabId || (t === "__menu" && !inBar));
      });
      const title = document.getElementById("mobile-title");
      if (title) title.textContent = tabId === "dashboard" ? "KERJORA" : (menuLabels[tabId] || "KERJORA");
    }

    let currentTabId = null;

    // Tahap 5 — banner masa aktif untuk Pemilik: muncul saat sisa waktu paket
    // atau trial <= 7 hari, atau paket baru saja habis (14 hari terakhir).
    function renderPlanBanner() {
      const el = document.getElementById("plan-banner");
      const info = planInfoSync();
      el.className = "hidden";
      if (!info || !info.is_owner || info.plan === "internal") return;
      const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      let tone = "", text = "", label = "Perpanjang";
      const d = info.days_left;
      if (d !== null && d !== undefined && d <= 7) {
        const nm = esc(info.plan_nama || info.plan);
        const trial = info.status === "trial";
        tone = d <= 2 ? "danger" : "warn";
        text = d <= 0
          ? `${trial ? "Masa percobaan" : "Paket " + nm} berakhir hari ini.`
          : `${trial ? "Masa percobaan paket " + nm : "Paket " + nm} berakhir ${d} hari lagi (${esc(fmtDate(info.plan_expires_at || info.trial_ends_at))}).`;
      } else if (info.recently_expired) {
        const from = esc(info.recently_expired.from_plan || "berbayar");
        tone = "danger";
        label = "Aktifkan lagi";
        text = `Masa aktif paket ${from} sudah habis, usahamu kembali ke paket Gratis. Fitur berbayar terkunci, datanya tetap aman.`;
      } else return;
      el.className = `plan-banner plan-banner-${tone}`;
      el.innerHTML = `<span>${text}</span><button type="button" class="btn-primary btn-sm" id="plan-banner-btn">${label}</button>`;
      document.getElementById("plan-banner-btn").addEventListener("click", () => loadTab("paket"));
    }

    async function loadTab(tabId, { silent = false } = {}) {
      if (!isTabAllowed(tabId)) {
        document.getElementById("content").innerHTML = isMenuBlockedByPlan(tabId)
          ? `<p class="muted">Fitur ini tidak termasuk paket usahamu. Lihat menu <b>Paket &amp; Fitur</b> untuk fitur yang tersedia.</p>`
          : `<p class="muted">Kamu tidak punya akses ke halaman ini. Hubungi Super Admin / Super Admin HR kalau merasa ini seharusnya bisa diakses.</p>`;
        return;
      }
      const loader = MODULE_MAP[tabId];
      const contentEl = document.getElementById("content");
      currentTabId = tabId;
      if (!silent) {
        contentEl.innerHTML = `<div class="skeleton-page"><div class="skeleton sk-title"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div></div>`;
        window.scrollTo(0, 0);
      }
      try {
        const mod = await loader();
        document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.target === tabId));
        updateTabbarActive(tabId);
        await mod.render(contentEl, currentUser);
        contentEl.classList.remove("page-enter");
        void contentEl.offsetWidth; // restart animasi
        contentEl.classList.add("page-enter");
        history.replaceState(null, "", `#${tabId}`);
      } catch (err) {
        console.error("Gagal memuat halaman:", err);
        document.getElementById("content").innerHTML =
          `<p class="muted">Terjadi kesalahan saat memuat halaman ini: ${err.message}. Coba refresh, atau cek console browser (F12) untuk detail.</p>`;
      }
    }

    (async function init() {
      try {
        currentUser = await requireAuth(["super_admin", "super_admin_hr", "admin_hr", "admin_approval", "karyawan"]);
      } catch (err) {
        console.error("Gagal memeriksa sesi:", err);
        document.getElementById("content").innerHTML =
          `<p class="muted">Gagal memeriksa sesi login: ${err.message}</p>`;
        return;
      }
      if (!currentUser) return;

      if (new URLSearchParams(location.search).get("reason") === "forbidden") {
        toast("Kamu tidak punya akses ke halaman itu.", "error");
        history.replaceState(null, "", "app.html");
      }

      const menu = await renderSidebar(currentUser, null); // activeId diisi ulang di loadTab lewat startTab
      // Semua role dibatasi ke menu yang benar-benar muncul di sidebar-nya,
      // hasil dari resolveMenu(): toggle Pengaturan Sistem per role (kecuali
      // super_admin yang tidak difilter toggle) DAN paket usaha (Tahap 4,
      // berlaku untuk super_admin juga).
      allowedTabIds = new Set(menu.map(m => m.id));
      menuLabels = Object.fromEntries(menu.map(m => [m.id, m.label]));
      buildTabbar(menu);
      renderPlanBanner();

      const fallbackTab = "dashboard";
      const hashTab = location.hash.replace("#", "");
      const startTab = hashTab && isTabAllowed(hashTab) ? hashTab : fallbackTab;

      const sidebar = document.getElementById("sidebar");
      const backdrop = document.getElementById("sidebar-backdrop");
      function closeMobileMenu() {
        sidebar.classList.remove("mobile-open");
        backdrop.classList.remove("show");
      }
      document.getElementById("btn-hamburger").addEventListener("click", () => {
        sidebar.classList.add("mobile-open");
        backdrop.classList.add("show");
      });
      backdrop.addEventListener("click", closeMobileMenu);

      document.getElementById("tabbar").addEventListener("click", e => {
        const btn = e.target.closest(".tab-item");
        if (!btn) return;
        if (navigator.vibrate) navigator.vibrate(8); // getar halus (Android)
        if (btn.dataset.tab === "__menu") {
          sidebar.classList.add("mobile-open");
          backdrop.classList.add("show");
        } else {
          loadTab(btn.dataset.tab);
        }
      });

      document.getElementById("sidebar-nav").addEventListener("click", e => {
        const btn = e.target.closest(".nav-item");
        if (btn) {
          loadTab(btn.dataset.target);
          closeMobileMenu(); // tutup drawer di HP begitu satu menu dipilih
        }
      });
      document.getElementById("btn-logout").addEventListener("click", logout);

      window.addEventListener("kerjora:navigate", e => {
        if (e.detail?.tab) loadTab(e.detail.tab);
      });
      // Notifikasi baru masuk (realtime) -> segarkan halaman baca-saja yang sedang
      // terbuka, supaya mis. banner "belum check-out" hilang setelah koreksi disetujui.
      // Halaman berisi formulir sengaja tidak disentuh agar isian tidak hilang.
      window.addEventListener("kerjora:notification", e => {
        if (e.detail?.type === "approval_decided" && ["dashboard", "riwayat"].includes(currentTabId)) {
          loadTab(currentTabId, { silent: true });
        }
      });
      initNotifications(currentUser);

      loadTab(startTab);
    })();
  </script>
</body>
</html>
